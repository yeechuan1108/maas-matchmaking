services:
  # 服務 1: Apache Jena Fuseki (Ontology / Knowledge Graph)
  fuseki:
    build: ./fuseki-docker-master
    container_name: fuseki_service
    ports:
      - "3030:3030"
    volumes:
      - ./fuseki-data:/fuseki
    environment:
      - ADMIN_PASSWORD=admin123
      - FUSEKI_DATASET=accurateDB

  # 服務 2: 自動載入 Ontology（等 Fuseki 準備好後執行一次）
  fuseki-init:
    image: curlimages/curl:latest
    container_name: fuseki_init
    depends_on:
      - fuseki
    volumes:
      - ./ontology:/ontology
    entrypoint: >
      sh -c "
        echo 'Waiting for Fuseki to be ready...' &&
        until curl -s -u admin:admin123 http://fuseki_service:3030/$/ping > /dev/null 2>&1; do
          sleep 3;
        done &&
        echo 'Fuseki is ready. Loading ontology...' &&
        curl -X POST
          -H 'Content-Type: text/turtle'
          --data-binary @/ontology/OBMM_RESCUE.ttl
          --user admin:admin123
          http://fuseki_service:3030/accurateDB/data &&
        echo 'Ontology loaded successfully!'
      "
    restart: "no"

  # 服務 3: Streamlit (Matchmaking Assistant UI)
  streamlit:
    build: .
    container_name: streamlit_service
    ports:
      - "8501:8501"
    depends_on:
      - fuseki
    volumes:
      - .:/app
    environment:
      - FUSEKI_URL=http://fuseki_service:3030/accurateDB/sparql
      - OLLAMA_HOST=http://host.docker.internal:11434

networks:
  default:
    name: maas_network

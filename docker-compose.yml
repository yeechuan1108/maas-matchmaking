services:
  # 服務 1: Apache Jena Fuseki (Ontology / Knowledge Graph)
  fuseki:
    build: ./fuseki-docker-master
    container_name: fuseki_service
    ports:
      - "3030:3030"
    volumes:
      - ./fuseki-data:/fuseki
    environment:
      - ADMIN_PASSWORD=admin123
      - FUSEKI_DATASET=accurateDB

  # 服務 2: 自動建立 Dataset 並載入 Ontology
  fuseki-init:
    image: curlimages/curl:latest
    container_name: fuseki_init
    depends_on:
      - fuseki
    volumes:
      - ./ontology:/ontology
      - ./fuseki-init.sh:/fuseki-init.sh
    entrypoint: ["/bin/sh", "/fuseki-init.sh"]
    restart: "no"

  # 服務 3: Streamlit (Matchmaking Assistant UI)
  streamlit:
    build: .
    container_name: streamlit_service
    ports:
      - "8501:8501"
    depends_on:
      - fuseki
    volumes:
      - .:/app
    environment:
      - FUSEKI_URL=http://fuseki_service:3030/accurateDB/sparql
      - OLLAMA_HOST=http://172.18.0.1:11434

networks:
  default:
    name: maas_network
